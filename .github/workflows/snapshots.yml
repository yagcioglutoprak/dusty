name: Panel snapshots

# Renders every state of the panel (welcome, home, scanning, a level, the
# confirmation sheet, the undo receipt, settings, the memory screen and its
# sheets) in light and dark from
# fixture data, plus the README demo GIF, and uploads them. A reviewer can see
# what a UI change looks like without building it. The render path only exists
# in Debug builds.

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'Dusty/**'
      - '.github/workflows/snapshots.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dusty/**'
      - '.github/workflows/snapshots.yml'

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Render panel snapshots
    # Branches in this repo already rendered on push; the PR run is for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build (Debug, no signing)
        working-directory: Dusty
        run: |
          xcodebuild \
            -project Dusty.xcodeproj \
            -scheme Dusty \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Render
        run: |
          mkdir -p snapshots
          # perl's alarm is a portable timeout: a stuck render fails the step
          # instead of holding the runner until the job limit.
          perl -e 'alarm shift; exec @ARGV' 240 \
            Dusty/build/Build/Products/Debug/Dusty.app/Contents/MacOS/Dusty \
            --render-snapshots "$PWD/snapshots"
          ls -la snapshots

      - name: Demo GIF
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install gifski
          # Full motion quality: lower settings keep "close enough" pixels between
          # frames, which leaves ghosts of the previous screen after a crossfade.
          gifski --fps 20 --width 480 --quality 100 --motion-quality 100 --extra \
            -o snapshots/demo.gif snapshots/demo-frames/*.png
          ls -la snapshots/demo.gif

      - uses: actions/upload-artifact@v4
        with:
          name: panel-snapshots
          path: |
            snapshots/*.png
            snapshots/*.gif
          if-no-files-found: error
